name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gacts/gitleaks@4fd785dcdaf557fda64e05b0ae033b8f7d82fb81 # v1.3.3
        with:
          version: 8.30.1
          config-path: .gitleaks.toml

  workflows:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit the workflows
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes -r .github/requirements/zizmor.txt
          "$RUNNER_TEMP/venv/bin/zizmor" --offline .github/workflows

  suppressions:
    name: Suppressions are listed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the suppressions in the code with .suppressions
        run: |
          set -eu
          export LC_ALL=C
          found=$(mktemp)
          # git grep exits 1 when nothing matches, which is a valid answer here.
          {
            git grep -H -E '#[[:space:]]*(noqa|type:[[:space:]]*ignore)' -- '*.py' || true
            git grep -H -E '#[[:space:]]*[z]izmor:[[:space:]]*ignore\[' -- '.github/workflows/*.yml' || true
          } | sed -E 's/^([^:]+):.*(#[[:space:]]*(noqa|type:|zizmor:).*)$/\1: \2/' | sort > "$found"
          diff -u .suppressions "$found"

  commit-policy:
    name: Commit policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the checker
        run: python3 -m unittest discover --start-directory .github/scripts --pattern 'test_*.py'
      # The approved people are listed in the organisation variable ALLOWED_COMMIT_IDENTITIES.
      - name: Check the commits, the title and the description
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          ALLOWED_COMMIT_IDENTITIES: ${{ vars.ALLOWED_COMMIT_IDENTITIES }}
        run: python3 .github/scripts/commit_policy.py
