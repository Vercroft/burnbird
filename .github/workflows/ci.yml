name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  # Runs every hook in .pre-commit-config.yaml (engineering-practices docs/required-checks.md); a new small check
  # is a new hook there. A check that reads the pull request, not the files, is a step after the hooks.
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit policy reads every commit of the pull request.
          fetch-depth: 0
          persist-credentials: false
      # Only runs the tools: pinned to a version every pinned package has a wheel for.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      # gitleaks scans staged changes, and CI has none; the Secret scan check scans the full history.
      - name: Run every hook
        env:
          SKIP: gitleaks
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r .github/requirements/pre-commit.txt -r .github/requirements/zizmor.txt
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          pre-commit run --all-files --hook-stage manual --show-diff-on-failure
      # The approved people are listed in the organisation variable ALLOWED_COMMIT_IDENTITIES.
      - name: Check the commits, the title and the description
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          ALLOWED_COMMIT_IDENTITIES: ${{ vars.ALLOWED_COMMIT_IDENTITIES }}
        run: python3 .github/scripts/commit_policy.py

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # A throwaway Postgres for the storage tests and a local Mailpit for the email tests. Each image
    # is pinned by digest, here only; CONTRIBUTING.md reads it from this file for the local container.
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_DB: burnbird_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d burnbird_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      # No test reaches a real mail server: Mailpit keeps every message it is given.
      mailpit:
        image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
        env:
          MP_DISABLE_VERSION_CHECK: "true"
          MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
          MP_MAX_MESSAGE_SIZE: "1"
          MP_MAX_MESSAGES: "200"
        ports:
          - 1025:1025
          - 8025:8025
        # The email tests start only once Mailpit answers on its readiness endpoint.
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      BURNBIRD_TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/burnbird_test
      BURNBIRD_TEST_SMTP_URL: smtp://localhost:1025
      BURNBIRD_TEST_MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      # uv installs the Python that .python-version names.
      - name: Install
        run: uv sync --locked
      - name: Format
        run: uv run --locked ruff format --check
      - name: Lint
        run: uv run --locked ruff check
      - name: Types
        run: uv run --locked mypy
      - name: One Python version everywhere
        run: uv run --locked pytest -n 0 tests/test_python_version.py
      - name: Tests
        run: uv run --locked pytest

  # The one CI check the ruleset requires, so a job here can be renamed without a ruleset change.
  # `if: always()` so a failed job cannot skip it; it fails unless every job it needs passed or was
  # skipped. tests/test_gate_summary.py fails when a job in this file is missing from `needs`, when
  # the verdict accepts a failure, or when another job gets an `if:`.
  gate-summary:
    name: Gate summary
    if: always()
    needs: [repository-checks, python]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every needed job to have passed or been skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {job: need["result"] for job, need in json.loads(os.environ["NEEDS_JSON"]).items()}
          for job, result in sorted(results.items()):
              print(f"{job}: {result}")
          bad = sorted(f"{job}={result}" for job, result in results.items() if result not in ("success", "skipped"))
          if not results or bad:
              sys.exit("not every needed job passed or was skipped: " + (", ".join(bad) or "no jobs"))
          PY
