name: dependency-age

# Fails when a pull request locks a package version younger than 7 days: uv.lock must match
# pyproject.toml's exclude-newer = "7 days". GitHub Actions pins are covered by Dependabot's cooldown.
on:
  pull_request:

permissions: {}

jobs:
  dependency-age:
    name: dependency-age
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: The Python lockfile holds only versions at least 7 days old
        run: uv lock --check
