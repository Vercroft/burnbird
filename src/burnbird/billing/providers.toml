# Which provider runs a job, and what a minute costs. Data only: burnbird/billing/providers.py reads and validates it, and
# nothing in it is ever evaluated. Money and weights are strings, read as Decimal. Every row names the pages its
# facts come from and the date they were read. Label patterns are matched with fnmatch.fnmatchcase.
#
# [B]  https://docs.github.com/en/billing/concepts/product-billing/github-actions
# [P]  https://docs.github.com/en/billing/reference/actions-runner-pricing
# [H]  https://docs.github.com/en/actions/reference/runners/github-hosted-runners
# [L]  https://docs.github.com/en/actions/reference/runners/larger-runners
# [R]  https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job
# [BS] https://docs.blacksmith.sh/blacksmith-runners/overview

# GitHub rounds each job up to a whole minute [P]. Included usage is money, reset each billing cycle [B].
[[provider]]
id = "github"
name = "GitHub-hosted"
rounding = "job-up-to-minute"
estimate = false
sources = [
    "https://docs.github.com/en/billing/concepts/product-billing/github-actions",
    "https://docs.github.com/en/billing/reference/actions-runner-pricing",
]
read = "2026-11-13"

[[provider.allowance]]
plan = "GitHub Free"
amount = "12"
unit = "usd"
period = "billing-cycle"

[[provider.allowance]]
plan = "GitHub Pro"
amount = "18"
unit = "usd"
period = "billing-cycle"

[[provider.allowance]]
plan = "GitHub Free for organizations"
amount = "12"
unit = "usd"
period = "billing-cycle"

[[provider.allowance]]
plan = "GitHub Team"
amount = "18"
unit = "usd"
period = "billing-cycle"

[[provider.allowance]]
plan = "GitHub Enterprise Cloud"
amount = "300"
unit = "usd"
period = "billing-cycle"

# Blacksmith states neither rounding nor its reset day [BS]; jobs are counted as rounded up to a whole minute, as
# GitHub does, and its numbers are shown as an estimate.
[[provider]]
id = "blacksmith"
name = "Blacksmith"
rounding = "job-up-to-minute"
estimate = true
sources = ["https://docs.blacksmith.sh/blacksmith-runners/overview"]
read = "2026-11-13"

[[provider.allowance]]
plan = "every organization"
amount = "3000"
unit = "x64-2vcpu-minute"
period = "month"

# Self-hosted runners are free and have no allowance [B]: exact time, no rounding.
[[provider]]
id = "self-hosted"
name = "Self-hosted"
rounding = "none"
estimate = false
sources = ["https://docs.github.com/en/billing/concepts/product-billing/github-actions"]
read = "2026-11-13"

